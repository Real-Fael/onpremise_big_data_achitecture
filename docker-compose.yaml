version: '3.9'

services:
  postgres_origin:
    image: postgres:latest
    hostname: postgres_origin
    container_name: postgres_origin
    deploy:
      resources:
        limits:
          memory: 512M  # Limite de memória de 512 MB
          # cpus: '0.5'   # Limite de 0.5 CPU (opcional)
    networks: 
      - poc-big-data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user_sql
      - POSTGRES_PASSWORD=PG@@cdc**sql
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"      
      #Write Ahead Log
    volumes:
      - ./postgres_origin/db:/var/lib/postgresql/data 
      - ./postgres_origin/insert:/data/insert


  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    deploy:
      resources:
        limits:
          memory: 512M  # Limite de memória de 512 MB
          # cpus: '0.5'   # Limite de 0.5 CPU (opcional)
    networks: 
      - poc-big-data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=user_minio
      - MINIO_ROOT_PASSWORD=MIN@@cdc**min
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"  # Inicia o MinIO com o console habilitado


  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka
    deploy:
      resources:
        limits:
          memory: 512M  # Limite de memória de 512 MB
          # cpus: '0.5'   # Limite de 0.5 CPU (opcional)
    networks: 
      - poc-big-data
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    volumes:
      - ./kafka/data:/var/lib/kafka/data
      - ./kafka/logs:/opt/kafka/logs
    # command: server /data --console-address ":9001"  # Inicia o MinIO com o console habilitado

  kafdrop:
    image: obsidiandynamics/kafdrop
    restart: "no"
    hostname: kafdrop
    container_name: kafdrop
    deploy:
      resources:
        limits:
          memory: 512M  # Limite de memória de 512 MB
          # cpus: '0.5'   # Limite de 0.5 CPU (opcional)
    networks: 
      - poc-big-data
    ports:
      - "8000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    depends_on:
      - "kafka"

  debezium:
    image: debezium/connect:3.0.0.Final
    hostname: debezium
    container_name: debezium
    deploy:
      resources:
        limits:
          memory: 512M  # Limite de memória de 512 MB
    networks: 
      - poc-big-data
    ports:
      - "8083:8083"  # Porta para acessar a API REST do Debezium
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092  # Conexão com o Kafka
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONNECT_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_INTERNAL_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_INTERNAL_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_LOG4J_ROOT_LOGLEVEL=INFO
      - CONNECT_PLUGIN_PATH=/kafka/connect
    depends_on:
      - kafka
      - postgres_origin
    volumes:
      - ./debezium/data:/kafka/data








networks: 
  poc-big-data:
    driver: bridge    
